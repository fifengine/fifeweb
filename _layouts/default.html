<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FIFE engine - open-source multi-platform isometric game engine">
    <meta name="keywords" content="FIFE, fife, game, engine, isometric, grid, editor, python, c++">
    <meta name="author" content="rivon">

    <!-- Open Graph -->
    <meta property="og:title" content="FIFE Engine">
    <meta property="og:description" content="Open-source multi-platform isometric game engine">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fifengine.github.io/">
    <meta property="og:image" content="https://fifengine.github.io/img/screen7.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FIFE Engine">
    <meta name="twitter:description" content="Open-source multi-platform isometric game engine">
    <meta name="twitter:image" content="https://fifengine.github.io/img/screen7.png">

    <link rel="icon" type="image/png" href="/img/FIFE_logo.png">

    <title>{{ page.title }}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <style>
        .logo-container {
            height: 120px;
            background: url('img/logo_screen.png') no-repeat;
            background-position: right;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-700">
    <div class="container mx-auto px-4">
        <!-- Logo -->
        <div class="logo-container mt-4">
            <img src="img/FIFE_logo.png" alt="FIFE Logo" class="h-full">
        </div>

        <!-- Slideshow -->
        <div class="my-4 relative">
            <div class="swiper main-swiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><a href="img/screen1.png" class="glightbox"><img src="img/screen1.png" loading="lazy" class="w-full h-64 object-cover rounded"></a></div>
                    <div class="swiper-slide"><a href="img/screen2.png" class="glightbox"><img src="img/screen2.png" loading="lazy" class="w-full h-64 object-cover rounded"></a></div>
                    <div class="swiper-slide"><a href="img/screen3.jpg" class="glightbox"><img src="img/screen3.jpg" loading="lazy" class="w-full h-64 object-cover rounded"></a></div>
                    <div class="swiper-slide"><a href="img/screen4.jpg" class="glightbox"><img src="img/screen4.jpg" loading="lazy" class="w-full h-64 object-cover rounded"></a></div>
                    <div class="swiper-slide"><a href="img/screen5.png" class="glightbox"><img src="img/screen5.png" loading="lazy" class="w-full h-64 object-cover rounded"></a></div>
                    <div class="swiper-slide"><a href="img/screen6.jpg" class="glightbox"><img src="img/screen6.jpg" loading="lazy" class="w-full h-64 object-cover rounded"></a></div>
                    <div class="swiper-slide"><a href="img/screen7.png" class="glightbox"><img src="img/screen7.png" loading="lazy" class="w-full h-64 object-cover rounded"></a></div>
                    <div class="swiper-slide"><a href="img/screen8.png" class="glightbox"><img src="img/screen8.png" loading="lazy" class="w-full h-64 object-cover rounded"></a></div>
                    <div class="swiper-slide"><a href="img/screen9.png" class="glightbox"><img src="img/screen9.png" loading="lazy" class="w-full h-64 object-cover rounded"></a></div>
                </div>
                <div class="swiper-pagination"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
            </div>
        </div>

        <!-- Navbar -->
        <nav class="bg-gray-800 text-white rounded mb-4">
            <div class="flex items-center justify-between px-4 py-2">
                <ul class="flex space-x-4">
                    <li><a href="index.html" class="{% if page.active == 'home' %}text-blue-400{% else %}text-white{% endif %} hover:text-blue-300">Home</a></li>
                    <li><a href="media.html" class="{% if page.active == 'media' %}text-blue-400{% else %}text-white{% endif %} hover:text-blue-300">Media</a></li>
                    <li><a href="https://docs.fifengine.net" class="text-white hover:text-blue-300">Docs</a></li>
                    <li><a href="https://github.com/fifengine/fifengine/discussions" class="text-white hover:text-blue-300">Forums</a></li>
                    <li><a href="https://github.com/fifengine/fifengine/releases" class="text-white hover:text-blue-300">Downloads</a></li>
                    <li><a href="https://github.com/fifengine/fifengine/issues" class="text-white hover:text-blue-300">Issues</a></li>
                    <li><a href="https://discord.gg/CBWC5KmDca" class="text-white hover:text-blue-300">Discord</a></li>
                </ul>
                <div class="flex space-x-2">
                    <iframe src="https://ghbtns.com/github-btn.html?user=fifengine&repo=fifengine&type=watch&count=true" allowtransparency="true" frameborder="0" scrolling="0" width="110" height="20"></iframe>
                    <iframe src="https://ghbtns.com/github-btn.html?user=fifengine&repo=fifengine&type=sponsor" allowtransparency="true" frameborder="0" scrolling="0" width="130" height="20"></iframe>
                </div>
            </div>
        </nav>

        <!-- Content -->
        <main class="bg-white rounded p-4 mb-4">
            {{ content }}
        </main>

        <!-- Footer -->
        <footer class="text-center py-4 text-gray-500">
            <p><small>Copyright &copy; 2005 to <span id="year"></span>, FIFEngine Team.</small></p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const lightbox = GLightbox({});

        const mainSwiper = new Swiper('.main-swiper', {
            autoplay: { delay: 4000, disableOnInteraction: false },
            pagination: { el: '.swiper-pagination', clickable: true },
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            loop: true,
            effect: 'fade',
        });
    </script>
</body>
</html>
